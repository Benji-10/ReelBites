# =============================================================================
# Netlify Configuration for Reel Recipes
# =============================================================================
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# =============================================================================

[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Prisma needs to generate its client during the build.
  PRISMA_GENERATE_IN_POSTINSTALL = "true"

# -----------------------------------------------------------------------------
# Netlify Functions configuration
# -----------------------------------------------------------------------------
# The extraction pipeline can take 2-4 minutes for a typical Instagram reel.
# Netlify's free tier supports background functions up to 5 minutes (300s) by
# default — no timeout config needed. On Pro you can extend up to 15 min.
#
# To increase the function timeout on Netlify:
#   Site settings → Functions → Function timeout (seconds)
#
# external_node_modules: these packages must NOT be bundled by esbuild.
#   - @prisma/client / .prisma/client: the generated client lives in
#     node_modules/.prisma and would get tree-shaken out otherwise.
#   - ffmpeg-static: ships a platform-specific ffmpeg BINARY. If esbuild
#     tries to bundle it, the __dirname path resolution breaks and the
#     function crashes with "spawn .../ffmpeg ENOENT".
#   - tesseract.js: loads WASM + worker files at runtime; bundling breaks it.
#
# included_files: ensures these non-JS files are copied into the function
# bundle. Without this, esbuild strips out the ffmpeg binary even when the
# module is marked external.
# -----------------------------------------------------------------------------
[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    ".prisma/client",
    "ffmpeg-static",
    "tesseract.js"
  ]
  included_files = [
    "node_modules/ffmpeg-static/**/*",
    "node_modules/.prisma/client/**/*"
  ]

# -----------------------------------------------------------------------------
# Next.js Runtime Plugin
# -----------------------------------------------------------------------------
# This plugin is required for Next.js 16 on Netlify. It handles SSR, API
# routes, image optimization, and the App Router.
# It is installed as a devDependency in package.json so Netlify can resolve it
# from the repo without hitting the network.
# -----------------------------------------------------------------------------
[[plugins]]
  package = "@netlify/plugin-nextjs"
