# =============================================================================
# Netlify Configuration for RealBites
# =============================================================================
# Architecture: Hybrid (client-side WASM + server-side runtime ffmpeg)
#
# Heavy media processing can run client-side via WebAssembly, or server-side
# with an ffmpeg binary that is resolved at RUNTIME (system PATH, or a static
# build downloaded to /tmp on first use — see src/lib/video.ts). ffmpeg
# binaries are deliberately NOT bundled with the function: ffmpeg-static +
# @ffmpeg-installer together add ~143MB and would exceed Netlify's 250MB
# function size limit.
# =============================================================================

[build]
  command = "npx prisma generate && npx prisma db push --accept-data-loss && bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PRISMA_GENERATE_IN_POSTINSTALL = "true"

# -----------------------------------------------------------------------------
# Cache headers — prevent stale PWA caching issues
# -----------------------------------------------------------------------------
# HTML: no-cache (always revalidate — prevents serving stale HTML that
#   references deleted JS chunks after a deploy)
# JS/CSS with hashes: immutable + 1 year (safe because filenames change)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# -----------------------------------------------------------------------------
# Netlify Functions configuration
# -----------------------------------------------------------------------------
# The function bundle stays small because no ffmpeg/tesseract binaries are
# bundled (ffmpeg is resolved at runtime; tesseract runs client-side via
# WASM). Only Prisma needs special handling.
# -----------------------------------------------------------------------------
[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    ".prisma/client"
  ]
  included_files = [
    "node_modules/.prisma/client/**/*"
  ]

# -----------------------------------------------------------------------------
# Next.js Runtime Plugin (required for Next.js on Netlify)
# -----------------------------------------------------------------------------
[[plugins]]
  package = "@netlify/plugin-nextjs"
